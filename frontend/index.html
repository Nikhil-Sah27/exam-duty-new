<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Proctavo — Exam Duty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Theme is
      // per-role (key "theme:<role>"), so pick the role from the URL; the
      // role-picker ("/select-role") goes dark if ANY role opted in. Mirrors
      // app.store.ts — keep the two in sync.
      (function () {
        try {
          var path = location.pathname;
          var under = function (base) {
            return path === base || path.indexOf(base + "/") === 0;
          };
          var legacy = localStorage.getItem("theme") === "dark";
          var isDark = function (role) {
            var v = localStorage.getItem("theme:" + role);
            return v === "dark" || (v === null && legacy);
          };

          var dark = false;
          if (under("/login")) {
            dark = false;
          } else if (under("/invigilator")) {
            dark = isDark("invigilator");
          } else if (under("/rs")) {
            dark = isDark("rs");
          } else if (under("/dcs")) {
            dark = isDark("dcs");
          } else if (under("/select-role")) {
            // Any role dark → dark.
            var roles = ["cs", "dcs", "rs", "invigilator"];
            for (var i = 0; i < roles.length; i++) {
              if (localStorage.getItem("theme:" + roles[i]) === "dark") {
                dark = true;
                break;
              }
            }
            if (!dark && legacy) dark = true;
          } else {
            // Root + CS pages.
            dark = isDark("cs");
          }

          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full bg-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
