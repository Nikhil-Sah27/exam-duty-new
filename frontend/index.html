<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Home page tags, for crawlers and link previews that don't run JS. HomePage.tsx
         (HOME_META) sets the same values. Change both together. Each route sets its
         own via usePageMeta. The canonical is added there, not here, on purpose. -->
    <title>Proctavo — Exam duty &amp; invigilation planner for colleges</title>
    <meta
      name="description"
      content="Turn your exam timetable, rooms and faculty into a fair invigilation roster. Assign in a click, let teachers pick or swap duties, with reminders and phone alarms."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proctavo" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Proctavo — Exam duty &amp; invigilation planner for colleges" />
    <meta
      property="og:description"
      content="Turn your exam timetable, rooms and faculty into a fair invigilation roster. Assign in a click, let teachers pick or swap duties, with reminders and phone alarms."
    />
    <meta property="og:image" content="https://proctavo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Proctavo — Every exam room, covered." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Proctavo — Exam duty &amp; invigilation planner for colleges" />
    <meta
      name="twitter:description"
      content="Turn your exam timetable, rooms and faculty into a fair invigilation roster. Assign in a click, let teachers pick or swap duties, with reminders and phone alarms."
    />
    <meta name="twitter:image" content="https://proctavo.com/og-image.png" />
    <!-- Site name and logo in Google results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://proctavo.com/#website",
            "name": "Proctavo",
            "url": "https://proctavo.com/",
            "publisher": { "@id": "https://proctavo.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://proctavo.com/#organization",
            "name": "Proctavo",
            "url": "https://proctavo.com/",
            "logo": "https://proctavo.com/icon-512.png"
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <!-- Public landing page type: editorial serif display, Geist body, Geist Mono labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Theme is
      // per-role (key "theme:<role>"), so pick the role from the URL; the
      // role-picker ("/select-role") goes dark if ANY role opted in. Mirrors
      // app.store.ts — keep the two in sync.
      (function () {
        try {
          var path = location.pathname;
          var under = function (base) {
            return path === base || path.indexOf(base + "/") === 0;
          };
          var legacy = localStorage.getItem("theme") === "dark";
          var isDark = function (role) {
            var v = localStorage.getItem("theme:" + role);
            return v === "dark" || (v === null && legacy);
          };

          var dark = false;
          if (under("/login")) {
            dark = false;
          } else if (under("/invigilator")) {
            dark = isDark("invigilator");
          } else if (under("/rs")) {
            dark = isDark("rs");
          } else if (under("/dcs")) {
            dark = isDark("dcs");
          } else if (under("/select-role")) {
            // Any role dark → dark.
            var roles = ["cs", "dcs", "rs", "invigilator"];
            for (var i = 0; i < roles.length; i++) {
              if (localStorage.getItem("theme:" + roles[i]) === "dark") {
                dark = true;
                break;
              }
            }
            if (!dark && legacy) dark = true;
          } else {
            // Root + CS pages.
            dark = isDark("cs");
          }

          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full bg-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
